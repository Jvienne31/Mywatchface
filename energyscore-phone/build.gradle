plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'   // demandé par le Samsung Health Data SDK
}

android {
    namespace 'com.jvienne.energyscore.phone'
    compileSdk 35

    defaultConfig {
        applicationId "com.jvienne.santesync"
        minSdk 29   // Samsung Health Data SDK
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Même identifiant et même clé que l'appli montre : le Data Layer Wear OS ne relie que
    // des applis identiques des deux côtés. Clé debug versionnée (mots de passe standard).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    implementation "com.google.code.gson:gson:2.9.0"

    // Samsung Health Data SDK — AAR propriétaire, non distribué sur Maven.
    // À télécharger depuis https://developer.samsung.com/health/data (compte développeur requis),
    // puis à déposer ici : energyscore-phone/libs/health-data-api-*.aar
    // Tant que le fichier est absent, ce module ne compilera pas — c'est attendu, voir README.
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
