plugins { id 'com.android.application' }

android {
    namespace 'com.jvienne.prisme'
    compileSdk 35

    defaultConfig {
        applicationId "com.jvienne.prisme"
        minSdk 34   // Wear OS 5 : Watch Face Format v2
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Clé debug fixe, versionnée : l'APK construit par GitHub Actions (machine neuve à chaque
    // fois) et celui construit en local ont la même signature, donc se mettent à jour l'un
    // l'autre sans désinstaller. Mots de passe standard d'Android, sans valeur secrète.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Deux diffusions du même cadran :
    //  - standard : paquet com.jvienne.prisme, installé à la main (Wear Installer, adb) ;
    //  - push : paquet imposé par Watch Face Push (<appli>.watchfacepush.<cadran>), embarqué dans
    //    l'appli montre Santé Sync qui l'installe et le met à jour elle-même (Wear OS 6).
    //    Manifeste réduit (src/push), numéro de version = numéro de compilation GitHub.
    flavorDimensions "diffusion"
    productFlavors {
        standard {
            dimension "diffusion"
        }
        push {
            dimension "diffusion"
            applicationId "com.jvienne.santesync.watchfacepush.prisme"
            versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled true   // aucun fichier dex dans l'APK (exigé par la validation Watch Face Push)
        }
        release {
            minifyEnabled false
        }
    }

    // Le paquet ne contient aucun code : uniquement des ressources.
    androidResources {
        noCompress 'ttf'
    }
}
