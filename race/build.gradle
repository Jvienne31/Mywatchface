plugins { id 'com.android.application' }

android {
    namespace 'com.jvienne.race'
    compileSdk 35

    defaultConfig {
        applicationId "com.jvienne.race"
        minSdk 34   // Wear OS 5 : Watch Face Format v2
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Le paquet ne contient aucun code : uniquement des ressources.
    androidResources {
        noCompress 'ttf'
    }
}
