plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'   // Samsung Health Data SDK (essai de lecture directe sur la montre)
}

android {
    namespace 'com.jvienne.energyscore.watch'
    compileSdk 35

    defaultConfig {
        applicationId "com.jvienne.santesync"
        minSdk 33   // Wear OS 4
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Même identifiant et même clé que l'appli téléphone : le Data Layer Wear OS ne relie que
    // des applis identiques des deux côtés. Clé debug versionnée (mots de passe standard).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.google.code.gson:gson:2.9.0"

    // Essai : le Samsung Health Data SDK fonctionne-t-il aussi sur la montre ? Même .aar que
    // l'appli téléphone (energyscore-phone/libs, non versionné).
    implementation fileTree(dir: '../energyscore-phone/libs', include: ['*.aar'])
}
